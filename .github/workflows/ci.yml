name: CI

# Runs the tests on every push and pull request. On a push to main that passes,
# it also publishes the multi-architecture image to GHCR, which the update
# watcher on the potato pulls (see docs/update.md).
#
# No secrets are used, only the repository's own token. The tests never see
# anyone's recordings: those stay on Autumn's Mac (docs/testing.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # there is no go.sum yet (no outside Go dependencies)
      - run: test -z "$(gofmt -l server web)" || (gofmt -l server web; exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: The built app must not mention outside web addresses
        run: node scripts/check-no-external.mjs web/build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-no-external.test.mjs

  watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -x deploy/watcher/update.sh deploy/install.sh deploy/watcher/test.sh
      - name: Watcher tests (Linux, so the real flock is used)
        run: bash deploy/watcher/test.sh

  publish:
    needs: [go, web, scripts, watcher]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Never cancel a publish half way: an interrupted push can leave a partial
    # manifest on GHCR. A second push queues behind the first.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit count below needs full history
      - name: Version string (r<commit count>.<short sha>)
        id: vars
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version=r$(git rev-list --count HEAD).$short_sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ghcr.io/autumnsgrove/warbler:latest
            ghcr.io/autumnsgrove/warbler:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
